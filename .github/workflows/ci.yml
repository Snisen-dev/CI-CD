name: CI

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-app .

      - name: Run Ruff inside Docker
        run: docker run --rm ci-cd-app ruff check .

      - name: Run Pytest inside Docker
        run: >
          docker run --rm
          -e DB_HOST=host.docker.internal
          -e DB_PORT=3306
          -e DB_USER=root
          -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          -e DB_NAME=test_ci
          ci-cd-app
          pytest -v
