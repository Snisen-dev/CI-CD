name: CI

on:
  push:
    branches:
      - main
      - test

  pull_request:
    branches:
      - main
      - test

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-app .

      - name: Run Ruff
        run: docker run --rm ci-cd-app ruff check .

      - name: Run tests with Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Clean up Docker containers
        if: always()
        run: docker compose down --rmi all -v
